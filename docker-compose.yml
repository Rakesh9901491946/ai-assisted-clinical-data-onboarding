services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${ONBOARDING_DB_PASSWORD:-change-me}
    ports: ["5434:5432"]
    volumes: ["onboardingdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["uvicorn", "onboarding.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://onboarding:${ONBOARDING_DB_PASSWORD:-change-me}@db:5432/onboarding
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OMOP_DATABASE_URL: ${OMOP_DATABASE_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  onboardingdata:

